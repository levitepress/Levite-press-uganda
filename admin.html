<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Levite Press Uganda</title><link rel="stylesheet" href="assets/style.css"></head><body><nav class="nav"><div class="container navin"><a class="brand" href="index.html"><img class="logo" src="assets/logo.svg" alt="Levite Press Uganda"></a><button id="logoutBtn" class="btn outline">Sign out</button></div></nav><main class="dashboard"><div class="container"><div id="message" class="message" hidden></div><div class="card"><div class="eyebrow">Private administration</div><h1>Admin dashboard</h1><p class="muted">Applications, client requests and document records.</p></div><div class="card" style="margin-top:15px"><h2>Applications</h2><div class="tablewrap"><table class="table"><thead><tr><th>Reference</th><th>Student</th><th>Course</th><th>Status</th><th>Action</th></tr></thead><tbody id="apps"></tbody></table></div></div><div class="card" style="margin-top:15px"><h2>Client requests</h2><div class="tablewrap"><table class="table"><thead><tr><th>Reference</th><th>Name</th><th>Service</th><th>Status</th><th>Action</th></tr></thead><tbody id="reqs"></tbody></table></div></div></div></main><script type="module">
import {supabase} from "./assets/supabase.js";import {requireUser,profileFor,esc,msg} from "./assets/app.js";const u=await requireUser();if(!u)throw 0;const p=await profileFor(u.id);if(p?.role!=="admin"){document.querySelector("main").innerHTML='<div class="container"><div class="card"><h1>Access denied</h1><p>This area is restricted to administrators.</p></div></div>';throw 0}
async function load(){const [{data:apps,error:ae},{data:reqs,error:re}]=await Promise.all([supabase.from("applications").select("id,application_no,reference,full_name,course,status").order("created_at",{ascending:false}),supabase.from("client_requests").select("id,request_no,name,service,status").order("created_at",{ascending:false})]);if(ae||re)return msg((ae||re).message,"error");document.querySelector("#apps").innerHTML=(apps||[]).map(a=>`<tr><td>${esc(a.application_no||a.reference||a.id)}</td><td>${esc(a.full_name)}</td><td>${esc(a.course)}</td><td><select class="astatus" data-id="${a.id}">${["submitted","under_review","accepted","rejected","completed"].map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn secondary asave" data-id="${a.id}">Save</button></td></tr>`).join("");document.querySelector("#reqs").innerHTML=(reqs||[]).map(r=>`<tr><td>${esc(r.request_no)}</td><td>${esc(r.name)}</td><td>${esc(r.service)}</td><td><select class="rstatus" data-id="${r.id}">${["new","in_progress","waiting_client","completed","cancelled"].map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn secondary rsave" data-id="${r.id}">Save</button></td></tr>`).join("");
document.querySelectorAll(".asave").forEach(b=>b.onclick=async()=>{const v=document.querySelector(`.astatus[data-id="${b.dataset.id}"]`).value;const {error}=await supabase.from("applications").update({status:v}).eq("id",b.dataset.id);if(error)return msg(error.message,"error");msg("Application updated.","success")});document.querySelectorAll(".rsave").forEach(b=>b.onclick=async()=>{const v=document.querySelector(`.rstatus[data-id="${b.dataset.id}"]`).value;const {error}=await supabase.from("client_requests").update({status:v}).eq("id",b.dataset.id);if(error)return msg(error.message,"error");msg("Request updated.","success")});}load();
</script><script src="assets/register-sw.js"></script></body></html>
