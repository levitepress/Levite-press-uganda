<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Levite Press Uganda</title><link rel="stylesheet" href="assets/style.css"></head><body><nav class="nav"><div class="container navin"><a class="brand" href="index.html"><img class="logo" src="assets/logo.svg" alt="Levite Press Uganda"></a><button id="logoutBtn" class="btn outline">Sign out</button></div></nav><main class="dashboard"><div class="container"><div id="message" class="message" hidden></div><div class="dashgrid"><aside class="card side"><strong>My account</strong><a href="student-apply.html">Student application</a><a href="request-service.html">Request a service</a><a href="#applications">Applications</a><a href="#requests">Service requests</a><a href="#documents">Documents</a><a href="index.html">Website</a></aside><section><div class="card"><div class="eyebrow">Private portal</div><h1 id="welcome">My account</h1><p class="muted" id="email"></p></div><div class="statgrid" style="margin:15px 0"><div class="stat"><span>Applications</span><strong id="appCount">0</strong></div><div class="stat"><span>Requests</span><strong id="reqCount">0</strong></div><div class="stat"><span>Documents</span><strong id="docCount">0</strong></div></div><div class="card" id="applications"><h2>Applications</h2><div id="apps">Loading…</div></div><div class="card" id="requests" style="margin-top:15px"><h2>Service requests</h2><div id="requestsBox">Loading…</div></div><div class="card" id="documents" style="margin-top:15px"><h2>Documents</h2><div id="docs">Loading…</div></div></section></div></div></main><script type="module">
import {supabase} from "./assets/supabase.js";import {requireUser,profileFor,esc,signedDownload} from "./assets/app.js";const u=await requireUser();if(!u)throw new Error("No user");const p=await profileFor(u.id);document.querySelector("#welcome").textContent=`Welcome, ${p?.full_name||"there"}`;document.querySelector("#email").textContent=`${u.email} • ${p?.role||"account"}`;
const [{data:apps},{data:reqs},{data:docs}]=await Promise.all([supabase.from("applications").select("id,application_no,reference,course,status,created_at").eq("user_id",u.id).order("created_at",{ascending:false}),supabase.from("client_requests").select("id,request_no,service,status,created_at").eq("user_id",u.id).order("created_at",{ascending:false}),supabase.from("documents").select("id,file_name,storage_path,document_type,created_at").eq("user_id",u.id).order("created_at",{ascending:false})]);
document.querySelector("#appCount").textContent=apps?.length||0;document.querySelector("#reqCount").textContent=reqs?.length||0;document.querySelector("#docCount").textContent=docs?.length||0;
document.querySelector("#apps").innerHTML=apps?.length?`<div class="tablewrap"><table class="table"><tr><th>Reference</th><th>Course</th><th>Status</th></tr>${apps.map(a=>`<tr><td>${esc(a.application_no||a.reference||a.id)}</td><td>${esc(a.course)}</td><td><span class="badge">${esc(a.status)}</span></td></tr>`).join("")}</table></div>`:"<p class='muted'>No applications yet.</p>";
document.querySelector("#requestsBox").innerHTML=reqs?.length?`<div class="tablewrap"><table class="table"><tr><th>Reference</th><th>Service</th><th>Status</th></tr>${reqs.map(a=>`<tr><td>${esc(a.request_no)}</td><td>${esc(a.service)}</td><td><span class="badge">${esc(a.status)}</span></td></tr>`).join("")}</table></div>`:"<p class='muted'>No service requests yet.</p>";
document.querySelector("#docs").innerHTML=docs?.length?`<div class="tablewrap"><table class="table"><tr><th>File</th><th>Type</th><th></th></tr>${docs.map(d=>`<tr><td>${esc(d.file_name)}</td><td>${esc(d.document_type||"document")}</td><td><button class="btn secondary dl" data-path="${esc(d.storage_path)}">Download</button></td></tr>`).join("")}</table></div>`:"<p class='muted'>No documents yet.</p>";
document.querySelectorAll(".dl").forEach(b=>b.onclick=async()=>{const url=await signedDownload(b.dataset.path);location.href=url});
</script><script src="assets/register-sw.js"></script></body></html>
