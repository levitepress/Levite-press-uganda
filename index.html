<!doctype html><html lang="en-UG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Levite Press Admin | Student Resources</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="admin-shell"><div class="container"><a href="../index.html">← Back to website</a><div class="admin-card"><h1>Levite Press Resource Manager</h1><p>Sign in to upload and publish student notes and downloadable files.</p><div id="status" class="status"></div><div id="loginBox"><form id="loginForm" class="form"><input class="input" id="email" type="email" placeholder="Admin email" required><input class="input" id="password" type="password" placeholder="Password" required><button class="btn btn-blue" type="submit">Sign in</button></form></div><div id="adminBox" hidden><button id="signOut" class="btn">Sign out</button><hr><form id="uploadForm" class="form"><input class="input" id="title" placeholder="Resource title" required><input class="input" id="category" placeholder="Category e.g. Notes, Past Papers, Guides"><textarea class="textarea" id="description" placeholder="Short description"></textarea><input class="input" id="file" type="file" required><label><input id="published" type="checkbox" checked> Publish immediately</label><button class="btn btn-blue" type="submit">Upload resource</button></form><h2>Published / uploaded resources</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Title</th><th>File</th><th>Published</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></main><script src="../config.js"></script><script src="admin.js"></script></body></html>
