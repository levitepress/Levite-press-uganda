<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Levite Press Uganda</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="formwrap"><div class="center brandmark"><a href="index.html"><img class="logo" src="assets/logo.svg" alt="Levite Press Uganda"></a></div><div class="card"><h1>Sign in</h1><p class="muted">Access your Levite Press account.</p><div id="message" class="message" hidden></div><form id="login" class="form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button></form><p class="small">No account? <a href="register.html" style="color:#0f766e;font-weight:800">Create one</a></p><p><a href="index.html">← Back to website</a></p></div></main><script type="module">
import {supabase} from "./assets/supabase.js"; import {msg} from "./assets/app.js";
document.querySelector("#login").onsubmit=async e=>{e.preventDefault();const email=document.querySelector("#email").value.trim(),password=document.querySelector("#password").value;const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return msg(error.message,"error");const next=new URLSearchParams(location.search).get("next")||"dashboard.html";location.href=next;};
</script><script src="assets/register-sw.js"></script></body></html>
