<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Levite Press Uganda</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="formwrap"><div class="center brandmark"><a href="index.html"><img class="logo" src="assets/logo.svg" alt="Levite Press Uganda"></a></div><div class="card"><h1>Create your account</h1><p class="muted">Use a client account for service requests, or a student account for training applications.</p><div id="message" class="message" hidden></div><form id="register" class="form two"><label>Full name<input id="name" required autocomplete="name"></label><label>Phone<input id="phone" required autocomplete="tel" placeholder="07..."></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Account type<select id="type"><option value="client">Client</option><option value="student">Student</option></select></label><label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm password<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><div class="full"><button class="btn" type="submit">Create account</button></div></form><p class="small">By creating an account you agree to use accurate information.</p><p>Already registered? <a href="login.html" style="color:#0f766e;font-weight:800">Sign in</a></p></div></main><script type="module">
import {supabase} from "./assets/supabase.js"; import {msg} from "./assets/app.js";
const params=new URLSearchParams(location.search);if(params.get("type")==="student")document.querySelector("#type").value="student";
document.querySelector("#register").onsubmit=async e=>{e.preventDefault();const name=document.querySelector("#name").value.trim(),phone=document.querySelector("#phone").value.trim(),email=document.querySelector("#email").value.trim(),type=document.querySelector("#type").value,password=document.querySelector("#password").value,confirm=document.querySelector("#confirm").value;if(password!==confirm)return msg("Passwords do not match.","error");const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:name,phone,account_type:type},emailRedirectTo:`${location.origin}/dashboard.html`}});if(error)return msg(error.message,"error");if(data.session){location.href="dashboard.html"}else msg("Account created. Check your email to confirm your account, then sign in.","success");};
</script><script src="assets/register-sw.js"></script></body></html>
