<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a Service | Levite Press Uganda</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="formwrap"><div class="card"><h1>Request a service</h1><p class="muted">Submit a project request and track its progress from your account.</p><div id="message" class="message" hidden></div><form id="request" class="form"><label>Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required></label><label>Service<select id="service" required><option>Website design</option><option>Software / app development</option><option>Printing</option><option>Graphic design / branding</option><option>Computer training</option><option>Secretarial service</option><option>Database / digital solution</option><option>Other</option></select></label><label>Description<textarea id="description" required placeholder="Tell us what you need..."></textarea></label><button class="btn" type="submit">Submit request</button></form><p><a href="dashboard.html">← My account</a></p></div></main><script type="module">
import {supabase} from "./assets/supabase.js";import {requireUser,msg} from "./assets/app.js";const u=await requireUser();if(u){document.querySelector("#email").value=u.email||"";const {data:p}=await supabase.from("profiles").select("*").eq("id",u.id).maybeSingle();document.querySelector("#name").value=p?.full_name||"";document.querySelector("#phone").value=p?.phone||""}
document.querySelector("#request").onsubmit=async e=>{e.preventDefault();const u=await requireUser();if(!u)return;const {data,error}=await supabase.from("client_requests").insert({user_id:u.id,name:document.querySelector("#name").value,email:document.querySelector("#email").value,phone:document.querySelector("#phone").value,service:document.querySelector("#service").value,description:document.querySelector("#description").value}).select("request_no").single();if(error)return msg(error.message,"error");msg(`Request submitted. Reference: ${data.request_no}`,"success");e.target.reset();};
</script><script src="assets/register-sw.js"></script></body></html>
