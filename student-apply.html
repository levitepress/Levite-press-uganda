<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Application | Levite Press Uganda</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar"><div class="container"><span>Levite Press Uganda</span><span>24/6 • No Saturday classes</span></div></div><main class="formwrap"><div class="card"><h1>Online student application</h1><p class="muted">You can complete the form after signing in. Your application will receive a reference number.</p><div id="message" class="message" hidden></div><form id="apply" class="form two">
<label>Full name<input name="full_name" required></label><label>Date of birth<input name="date_of_birth" type="date"></label><label>Gender<select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select></label><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email" required></label><label>Location<input name="location" placeholder="Town / district"></label><label>Course<input name="course" required placeholder="e.g. Computer Applications"></label><label>Level<input name="level" placeholder="Beginner / Intermediate / Advanced"></label><label>Preferred time<select name="preferred_time"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><div class="full"><label>Preferred days</label><div class="checkrow"><label><input type="checkbox" name="days" value="Monday"> Mon</label><label><input type="checkbox" name="days" value="Tuesday"> Tue</label><label><input type="checkbox" name="days" value="Wednesday"> Wed</label><label><input type="checkbox" name="days" value="Thursday"> Thu</label><label><input type="checkbox" name="days" value="Friday"> Fri</label><label><input type="checkbox" name="days" value="Sunday"> Sun</label></div></div><label class="full">Experience<textarea name="experience"></textarea></label><label class="full">Additional information<textarea name="additional_information"></textarea></label><div class="full filebox"><label>Optional document/photo<input id="doc" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></label></div><div class="full"><button class="btn" type="submit">Submit application</button></div></form><p><a href="dashboard.html">← My account</a></p></div></main><script type="module">
import {supabase} from "./assets/supabase.js"; import {requireUser,uploadUserFile,msg} from "./assets/app.js";
const user=await requireUser(); if(user){const {data:p}=await supabase.from("profiles").select("*").eq("id",user.id).maybeSingle(); if(p?.role!=="student"&&p?.role!=="admin")msg("Your account is a client account. Create a student account if you want to apply for training.","error");document.querySelector('[name=email]').value=user.email||"";document.querySelector('[name=full_name]').value=p?.full_name||"";document.querySelector('[name=phone]').value=p?.phone||"";}
document.querySelector("#apply").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),days=[...document.querySelectorAll('[name=days]:checked')].map(x=>x.value);if(days.length<3||days.length>4)return msg("Choose 3 or 4 preferred days.","error");const u=await requireUser();if(!u)return;const row={user_id:u.id,full_name:f.get("full_name"),date_of_birth:f.get("date_of_birth")||null,gender:f.get("gender")||null,phone:f.get("phone"),email:f.get("email"),location:f.get("location")||null,course:f.get("course"),level:f.get("level")||null,preferred_time:f.get("preferred_time"),preferred_days:days,experience:f.get("experience")||null,additional_information:f.get("additional_information")||null,status:"submitted"};const {data,error}=await supabase.from("applications").insert(row).select("id,application_no,reference").single();if(error)return msg(error.message,"error");const file=document.querySelector("#doc").files[0];if(file){try{const path=await uploadUserFile(file,u.id,`application-${data.id}`);const d=await supabase.from("documents").insert({user_id:u.id,application_id:data.id,file_name:file.name,storage_path:path,document_type:"application_document",uploaded_by:u.id});if(d.error)throw d.error}catch(err){return msg(`Application submitted, but document upload failed: ${err.message}`,"error")}}msg(`Application submitted successfully. Reference: ${data.application_no||data.reference||data.id}`,"success");e.reset();};
</script><script src="assets/register-sw.js"></script></body></html>
